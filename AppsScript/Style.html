<style>
:root {
  --bg: #f6f7f9;
  --card: #ffffff;
  --primary: #0f766e;
  --primary-dark: #115e59;
  --line: #e5e7eb;
  --muted: #6b7280;
  --danger: #b91c1c;
}
* { box-sizing: border-box; }
body { margin:0; font-family: Arial, sans-serif; background:var(--bg); color:#111827; }
.topbar { display:flex; justify-content:space-between; gap:16px; align-items:center; padding:18px 24px; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; }
h1 { margin:0; font-size:24px; }
h2 { margin-top:0; }
p { margin:6px 0 0; color:var(--muted); }
.wrap { max-width:1200px; margin:0 auto; padding:22px; }
.grid { display:grid; gap:14px; }
.cards { grid-template-columns: repeat(4, 1fr); margin-bottom:16px; }
.card, .panel { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:0 1px 4px rgba(0,0,0,.04); }
.card span { display:block; color:var(--muted); font-size:13px; }
.card strong { display:block; font-size:24px; margin-top:8px; }
.panel { margin-bottom:16px; }
.formgrid { grid-template-columns: repeat(3, 1fr); }
label { display:block; font-size:13px; color:#374151; margin:6px 0; }
input, select { width:100%; padding:10px; border:1px solid var(--line); border-radius:10px; background:#fff; }
button { border:0; padding:10px 14px; border-radius:10px; background:#e5e7eb; cursor:pointer; font-weight:600; }
button:hover { filter:brightness(.96); }
button.primary { background:var(--primary); color:white; }
button.danger { background:var(--danger); color:white; }
.row { display:grid; grid-template-columns: 2fr .7fr .8fr .6fr auto; gap:10px; align-items:end; margin:10px 0; }
.actions { display:flex; justify-content:flex-end; margin-top:12px; }
table { width:100%; border-collapse:collapse; margin-top:10px; font-size:13px; }
th, td { padding:9px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
th { background:#f9fafb; color:#374151; }
.muted { color:var(--muted); }
#toast { position:fixed; right:20px; bottom:20px; background:#111827; color:white; padding:12px 16px; border-radius:10px; display:none; max-width:360px; }
.small { font-size:12px; color:var(--muted); }
@media (max-width: 900px) {
  .cards, .formgrid { grid-template-columns: 1fr; }
  .row { grid-template-columns:1fr; }
  .topbar { align-items:flex-start; flex-direction:column; }
}
</style>
