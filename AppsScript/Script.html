<script>
let DATA = { productos: [], pacientes: [], formasPago: [], dashboard: {}, deudores: [], ventas: [] };
let itemsVenta = [];
let itemsCompra = [];

document.addEventListener('DOMContentLoaded', () => {
  const hoy = new Date().toISOString().slice(0,10);
  document.getElementById('ventaFecha').value = hoy;
  cargarTodo();
});

function cargarTodo() {
  google.script.run
    .withSuccessHandler(data => {
      DATA = data;
      renderCombos();
      renderDashboard();
      renderDeudores();
      renderVentas();
      renderStock();
      toast('Datos actualizados');
    })
    .withFailureHandler(err => toast(err.message || err, true))
    .getAppData();
}

function renderCombos() {
  const paciente = document.getElementById('ventaPaciente');
  paciente.innerHTML = '<option value="">Seleccionar...</option>' + DATA.pacientes.map(p => `<option value="${esc(p.ID_PACIENTE)}">${esc((p.APELLIDO || '') + ' ' + (p.NOMBRE || ''))}</option>`).join('');

  const productoOptions = '<option value="">Producto...</option>' + DATA.productos.map(p => `<option value="${esc(p.ID_PRODUCTO)}">${esc(p.PRODUCTO)} | Stock ${p.STOCK_ACTUAL} | ${money(p.PRECIO_VENTA_PROPIO || p.PRECIO_VENTA_SUGERIDO)}</option>`).join('');
  document.getElementById('itemProducto').innerHTML = productoOptions;
  document.getElementById('compraProducto').innerHTML = productoOptions;

  const pagos = DATA.formasPago.map(x => `<option>${esc(x)}</option>`).join('');
  document.getElementById('ventaFormaPago').innerHTML = pagos;
}

function renderDashboard() {
  const d = DATA.dashboard || {};
  byId('kpiVentas').textContent = money(d.totalVentas || 0);
  byId('kpiCobrado').textContent = money(d.totalPagado || 0);
  byId('kpiSaldo').textContent = money(d.totalSaldo || 0);
  byId('kpiGanancia').textContent = money(d.totalGanancia || 0);
}

function agregarItemVenta() {
  const id = byId('itemProducto').value;
  const p = getProducto(id);
  if (!p) return toast('Elegí un producto', true);
  const cantidad = num(byId('itemCantidad').value);
  if (cantidad <= 0) return toast('Cantidad inválida', true);
  const precio = num(byId('itemPrecio').value) || p.PRECIO_VENTA_PROPIO || p.PRECIO_VENTA_SUGERIDO;
  const desc = num(byId('itemDesc').value);
  itemsVenta.push({ idProducto:id, producto:p.PRODUCTO, cantidad, precioVenta:precio, descuentoProducto:desc });
  renderItemsVenta();
}

function renderItemsVenta() {
  const rows = itemsVenta.map((x,i) => [x.producto, x.cantidad, money(x.precioVenta), x.descuentoProducto + '%', `<button class="danger" onclick="itemsVenta.splice(${i},1);renderItemsVenta()">Quitar</button>`]);
  byId('itemsVenta').innerHTML = table(['Producto','Cant.','Precio','Desc.',''], rows);
}

function guardarVentaUI() {
  const payload = {
    pacienteId: byId('ventaPaciente').value,
    fecha: byId('ventaFecha').value,
    formaPago: byId('ventaFormaPago').value,
    descuentoGeneral: num(byId('ventaDescGeneral').value),
    pagado: num(byId('ventaPagado').value),
    observaciones: byId('ventaObs').value,
    items: itemsVenta
  };
  google.script.run
    .withSuccessHandler(r => {
      toast(`Venta guardada. Estado: ${r.estado}. Saldo: ${money(r.saldo)}`);
      itemsVenta = [];
      renderItemsVenta();
      cargarTodo();
    })
    .withFailureHandler(err => toast(err.message || err, true))
    .guardarVenta(payload);
}

function crearPacienteUI() {
  const payload = { apellido:byId('pacApellido').value, nombre:byId('pacNombre').value, dni:byId('pacDni').value, telefono:byId('pacTelefono').value, observaciones:byId('pacObs').value };
  google.script.run
    .withSuccessHandler(() => {
      ['pacApellido','pacNombre','pacDni','pacTelefono','pacObs'].forEach(id => byId(id).value = '');
      toast('Paciente guardado');
      cargarTodo();
    })
    .withFailureHandler(err => toast(err.message || err, true))
    .crearPaciente(payload);
}

function agregarItemCompra() {
  const id = byId('compraProducto').value;
  const p = getProducto(id);
  if (!p) return toast('Elegí un producto', true);
  const cantidad = num(byId('compraCantidad').value);
  if (cantidad <= 0) return toast('Cantidad inválida', true);
  itemsCompra.push({ idProducto:id, producto:p.PRODUCTO, cantidad });
  renderItemsCompra();
}

function renderItemsCompra() {
  const rows = itemsCompra.map((x,i) => [x.producto, x.cantidad, `<button class="danger" onclick="itemsCompra.splice(${i},1);renderItemsCompra()">Quitar</button>`]);
  byId('itemsCompra').innerHTML = table(['Producto','Cant.',''], rows);
}

function confirmarCompraUI() {
  google.script.run
    .withSuccessHandler(r => {
      toast(`Compra confirmada: ${money(r.totalCompra)}`);
      itemsCompra = [];
      renderItemsCompra();
      cargarTodo();
    })
    .withFailureHandler(err => toast(err.message || err, true))
    .confirmarCompra({ items: itemsCompra, observaciones: byId('compraObs').value });
}

function renderDeudores() {
  const rows = (DATA.deudores || []).map(v => [v.FECHA, v.PACIENTE, money(v.TOTAL_FINAL), money(v.TOTAL_PAGADO), money(v.SALDO), `<button onclick="registrarPagoPrompt('${escAttr(v.ID_VENTA)}')">Pagar</button>`]);
  byId('tablaDeudores').innerHTML = table(['Fecha','Paciente','Total','Pagado','Saldo',''], rows);
}

function registrarPagoPrompt(idVenta) {
  const importe = prompt('Importe del pago');
  if (!importe) return;
  const formaPago = prompt('Forma de pago', 'Efectivo') || 'Efectivo';
  google.script.run
    .withSuccessHandler(() => { toast('Pago registrado'); cargarTodo(); })
    .withFailureHandler(err => toast(err.message || err, true))
    .registrarPago({ idVenta, importe, formaPago });
}

function renderVentas() {
  const rows = (DATA.ventas || []).map(v => [v.FECHA, v.PACIENTE, money(v.TOTAL_FINAL), money(v.SALDO), v.ESTADO, v.ESTADO !== 'Anulada' ? `<button class="danger" onclick="anularVentaUI('${escAttr(v.ID_VENTA)}')">Anular</button>` : '']);
  byId('tablaVentas').innerHTML = table(['Fecha','Paciente','Total','Saldo','Estado',''], rows);
}

function anularVentaUI(idVenta) {
  if (!confirm('¿Anular esta venta y devolver stock?')) return;
  google.script.run
    .withSuccessHandler(() => { toast('Venta anulada'); cargarTodo(); })
    .withFailureHandler(err => toast(err.message || err, true))
    .anularVenta(idVenta);
}

function renderStock() {
  const q = (byId('buscarStock')?.value || '').toLowerCase();
  const rows = DATA.productos.filter(p => !q || String(p.PRODUCTO).toLowerCase().includes(q) || String(p.CODIGO).toLowerCase().includes(q)).map(p => [p.CODIGO, p.PRODUCTO, p.DESCRIPCION || '', money(p.PRECIO_COMPRA_REVENTA), money(p.PRECIO_VENTA_PROPIO || p.PRECIO_VENTA_SUGERIDO), p.STOCK_ACTUAL]);
  byId('tablaStock').innerHTML = table(['Código','Producto','Descripción','Compra/Reventa','Venta','Stock'], rows);
}

function getProducto(id) { return DATA.productos.find(p => p.ID_PRODUCTO === id); }
function byId(id) { return document.getElementById(id); }
function num(v) { const n = Number(String(v || '0').replace(',', '.')); return isNaN(n) ? 0 : n; }
function money(n) { return new Intl.NumberFormat('es-AR', { style:'currency', currency:'ARS', maximumFractionDigits:0 }).format(Number(n || 0)); }
function esc(x) { return String(x ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }
function escAttr(x) { return esc(x).replace(/`/g, '&#096;'); }
function table(headers, rows) {
  if (!rows.length) return '<p class="muted">Sin datos.</p>';
  return '<table><thead><tr>' + headers.map(h => `<th>${esc(h)}</th>`).join('') + '</tr></thead><tbody>' + rows.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>').join('') + '</tbody></table>';
}
function toast(msg, isError) {
  const t = byId('toast');
  t.textContent = msg;
  t.style.background = isError ? '#991b1b' : '#111827';
  t.style.display = 'block';
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => t.style.display = 'none', 3800);
}
</script>
